# Балансировка нагрузки с Nginx
upstream backend_servers {
    # Основные серверы
    server backend1:3000 max_fails=2 fail_timeout=30s;
    server backend2:3000 max_fails=2 fail_timeout=30s;
    
    # Резервный сервер (используется только если оба основных недоступны)
    server backend3:3000 backup;
    
    # Алгоритм балансировки (round-robin по умолчанию)
    # least_conn;  # Раскомментировать для Least Connections
    # ip_hash;     # Раскомментировать для привязки к IP
}

server {
    listen 80;
    server_name localhost;
    
    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Основной location
    location / {
        proxy_pass http://backend_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
    
    # Health check endpoint (отключаем кэширование)
    location /health {
        proxy_pass http://backend_servers;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    
    # Статистика Nginx (опционально)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}