version: '3.8'

services:
  backend1:
    build: ./backend
    container_name: backend1
    environment:
      - PORT=3000
      - SERVER_ID=backend_1_main
    networks:
      - app-network

  backend2:
    build: ./backend
    container_name: backend2
    environment:
      - PORT=3000
      - SERVER_ID=backend_2_main
    networks:
      - app-network

  backend3:
    build: ./backend
    container_name: backend3
    environment:
      - PORT=3000
      - SERVER_ID=backend_3_backup
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge