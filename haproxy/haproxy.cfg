global
    daemon
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global

# Frontend - принимает запросы
frontend http_front
    bind *:80
    default_backend http_back
    
    # Добавляем заголовок с идентификатором сервера
    reqadd X-Forwarded-Proto:\ http

# Backend - балансировка
backend http_back
    balance roundrobin
    option httpchk GET /health
    
    # Основные серверы с проверкой здоровья
    server backend1 backend1:3000 check inter 3s fall 2 rise 2
    server backend2 backend2:3000 check inter 3s fall 2 rise 2
    
    # Резервный сервер
    server backend3 backend3:3000 check inter 3s fall 2 rise 2 backup

# Статистика HAProxy
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin